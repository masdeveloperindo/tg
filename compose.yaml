services:
  app:
    build: docker/development
    image: tg-development:php84
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    init: true
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: docker/development
      dockerfile: mysql.Dockerfile
    image: tg-development:mysql84
    environment:
      MYSQL_DATABASE: tg
      MYSQL_USER: tg
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      TZ: UTC
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --execute='SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s

  node:
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    profiles: [tools]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - .:/app

volumes:
  database:
